// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.2.20'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Several Capacitor plugin modules (pulled from node_modules) require JDK 21
// but don't request a toolchain themselves, so they'd otherwise compile with
// whatever JDK launched Gradle. Force every JavaCompile task onto a JDK 21
// toolchain explicitly — Gradle auto-downloads it via the foojay resolver
// (see settings.gradle) if one isn't already installed, so this works on any
// machine or CI runner regardless of the ambient JDK.
subprojects {
    plugins.withType(JavaBasePlugin).configureEach {
        tasks.withType(JavaCompile).configureEach {
            javaCompiler = javaToolchains.compilerFor {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
